name: E2E

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # ci-base is migration-managed (clean payload_migrations), so the PR's
      # own migrations can be rehearsed here — unlike `dev`, whose push-managed
      # bookkeeping makes `payload migrate` hang on an interactive prompt.
      - name: Create Neon branch
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_DEV_PROJECT_ID }}
          parent: ci-base
          branch_name: ci/${{ github.run_id }}
          api_key: ${{ secrets.NEON_DEV_API_KEY }}

      - name: Run migrations (rehearses the PR's own migrations pre-merge)
        run: pnpm payload migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      - name: Seed E2E test data
        run: pnpm exec tsx tests/helpers/seedUser.ts
        env:
          NODE_OPTIONS: --no-deprecation
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      # Visual baselines are platform-suffixed (…-chromium-linux.png vs
      # …-chromium-darwin.png). Local dev records darwin baselines via
      # `pnpm test:e2e:snapshots`; the linux ones can only be recorded on a
      # linux runner, so on first run (or after a deliberate baseline reset)
      # this step records them and pushes the commit to the PR branch. The
      # push triggers a fresh workflow run that then enforces against them.
      - name: Bootstrap missing Linux visual baselines
        id: baselines
        run: |
          SNAP_DIR="tests/e2e/smoke-locale-content.e2e.spec.ts-snapshots"
          MISSING=0
          for name in search-uk search-en posts-uk posts-en; do
            [ -f "$SNAP_DIR/${name}-chromium-linux.png" ] || MISSING=1
          done
          if [ "$MISSING" = "0" ]; then
            echo "Linux baselines present — enforcing."
            exit 0
          fi
          echo "Linux baselines missing — recording."
          pnpm test:e2e:snapshots
          cp -r "$SNAP_DIR" /tmp/snapshots-backup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          cp /tmp/snapshots-backup/*-chromium-linux.png "$SNAP_DIR/"
          git add "$SNAP_DIR"
          git commit -m "test: record linux visual regression baselines"
          git push origin "${{ github.head_ref }}"
          # Return to the PR merge ref for the enforcement run below; restore
          # the freshly recorded baselines as untracked files so the visual
          # specs compare against them in this run too.
          git checkout --detach "${{ github.sha }}"
          cp /tmp/snapshots-backup/*-chromium-linux.png "$SNAP_DIR/"
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_SERVER_URL: http://localhost:3100
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3100
          CRON_SECRET: ci-cron-secret
          PREVIEW_SECRET: ci-preview-secret

      - name: Run E2E tests
        # Full suite including visual regression snapshots (linux baselines).
        run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NEXT_PUBLIC_SERVER_URL: http://localhost:3100
          NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3100
          CRON_SECRET: ci-cron-secret
          PREVIEW_SECRET: ci-preview-secret

      - name: Cleanup E2E test data
        if: always()
        run: pnpm exec tsx tests/helpers/seedUser.ts cleanup
        env:
          NODE_OPTIONS: --no-deprecation
          DATABASE_URL: ${{ steps.neon.outputs.db_url_with_pooler }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      - name: Prepare Pages deployment
        if: failure() && hashFiles('playwright-report/index.html') != ''
        run: |
          mkdir -p /tmp/pages/reports/${{ github.run_id }}
          cp -r playwright-report/. /tmp/pages/reports/${{ github.run_id }}/
          touch /tmp/pages/.nojekyll

      - name: Deploy report to GitHub Pages
        if: failure() && hashFiles('playwright-report/index.html') != ''
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: /tmp/pages
          clean: false

      # Upsert the status comment on every run (including re-runs) so it never
      # points at a stale failed report after a later attempt passes. Only
      # failures create the comment; successes update an existing one.
      - name: Comment PR with E2E status
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- playwright-report -->'
            const failed = '${{ job.status }}' === 'failure'
            const hasReport = ${{ hashFiles('playwright-report/index.html') != '' }}
            const attempt = process.env.GITHUB_RUN_ATTEMPT
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            let status
            if (failed && hasReport) {
              status = `❌ E2E failed — [view report](https://${context.repo.owner}.github.io/${context.repo.repo}/reports/${context.runId}/) · [job logs](${runUrl})`
            } else if (failed) {
              status = `❌ E2E failed before any test ran (no report generated) — [job logs](${runUrl})`
            } else {
              status = `✅ E2E passed — [job logs](${runUrl})`
            }
            const body = `${marker}\n### Playwright Report\n\n${status} (run attempt ${attempt})`
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            const existing = comments.find(c => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            } else if (failed) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              })
            }

      - name: Delete Neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_DEV_PROJECT_ID }}
          branch: ci/${{ github.run_id }}
          api_key: ${{ secrets.NEON_DEV_API_KEY }}
